<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>成員介紹 | 妖契者</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="container nav">
    <a href="index.html" class="nav-logo">
      <img src="logo.png" alt="團隊 Logo">
      <span class="nav-logo-text">妖契者</span>
    </a>
    <button class="nav-toggle" aria-label="開啟選單" aria-expanded="false" id="navToggle">☰</button>
    <nav class="nav-links" id="navLinks">
      <a href="index.html">首頁</a>
      <a href="members.html" class="active">成員介紹</a>
      <a href="videos.html">影片精選</a>
      <a href="about.html">關於我們／聯絡我們</a>
    </nav>
  </div>
</header>

<div class="page-hero">
  <div class="container">
    <span class="section-num">MEMBERS</span>
    <h1>成員介紹</h1>
    <p id="membersIntro">這裡將放上每位成員的完整介紹：立繪、人設、專長與社群連結。</p>
  </div>
</div>

<section>
  <div class="container">
    <div class="placeholder-block">
      <strong id="membersPlaceholderTitle">成員介紹內容建置中</strong>
      <span id="membersPlaceholderText">待確認每位成員的詳細資料（立繪圖片連結、人設文案、社群連結）後，將在此區塊放上完整的成員卡片列表。</span>
    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="container">
    <div class="footer-top">
      <div class="footer-brand">
        <img src="logo.png" alt="團隊 Logo">
        妖契者
      </div>
      <div class="footer-social">
        <a href="#" id="socialYoutube" aria-label="YouTube">YT</a>
        <a href="#" id="socialTwitter" aria-label="X / Twitter">X</a>
        <a href="#" id="socialDiscord" aria-label="Discord">DC</a>
      </div>
    </div>
    <div class="footer-bottom">
      <span id="footerCopyright">© 2026 妖契者 VTuber Team. All rights reserved.</span>
      <a href="about.html">合作洽詢</a>
    </div>
  </div>
</footer>

<script>
  const navToggle = document.getElementById('navToggle');
  const navLinks = document.getElementById('navLinks');
  navToggle.addEventListener('click', () => {
    const open = navLinks.classList.toggle('open');
    navToggle.setAttribute('aria-expanded', open);
  });

  fetch('content.json')
    .then(res => res.json())
    .then(data => {
      if (data.membersPage) {
        if (data.membersPage.intro) document.getElementById('membersIntro').textContent = data.membersPage.intro;
        if (data.membersPage.placeholderTitle) document.getElementById('membersPlaceholderTitle').textContent = data.membersPage.placeholderTitle;
        if (data.membersPage.placeholderText) document.getElementById('membersPlaceholderText').textContent = data.membersPage.placeholderText;
      }
      if (data.site) {
        if (data.site.footerCopyright) document.getElementById('footerCopyright').textContent = data.site.footerCopyright;
        if (data.site.social) {
          if (data.site.social.youtube) document.getElementById('socialYoutube').href = data.site.social.youtube;
          if (data.site.social.twitter) document.getElementById('socialTwitter').href = data.site.social.twitter;
          if (data.site.social.discord) document.getElementById('socialDiscord').href = data.site.social.discord;
        }
      }
    })
    .catch(() => {});
</script>
</body>
</html>
