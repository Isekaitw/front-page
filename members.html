<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>成員介紹 | 妖契者</title>
<link rel="stylesheet" href="style.css">
<style>
  .members-full-grid {
    display: flex;
    flex-direction: column;
    gap: 32px;
  }
  .member-full-card {
    background: var(--bg-elevated);
    border: 1px solid var(--line);
    border-left: 3px solid var(--cyan-dim);
    display: flex;
    aspect-ratio: 16 / 9;
    overflow: hidden;
    transition: border-color 0.15s ease;
  }
  .member-full-card:hover { border-left-color: var(--cyan); }
  .member-full-left {
    flex: 0 0 36%;
    max-width: 400px;
    display: flex;
    flex-direction: column;
    padding: 28px 24px;
    border-right: 1px solid var(--line);
    overflow-y: auto;
  }
  .member-full-right {
    flex: 1;
    padding: 28px;
    overflow-y: auto;
  }
  .member-full-left,
  .member-full-right {
    scrollbar-width: thin;
    scrollbar-color: var(--cyan-dim) var(--bg-elevated-2);
  }
  .member-full-left::-webkit-scrollbar,
  .member-full-right::-webkit-scrollbar {
    width: 8px;
  }
  .member-full-left::-webkit-scrollbar-track,
  .member-full-right::-webkit-scrollbar-track {
    background: var(--bg-elevated-2);
  }
  .member-full-left::-webkit-scrollbar-thumb,
  .member-full-right::-webkit-scrollbar-thumb {
    background: var(--cyan-dim);
    border-radius: 4px;
  }
  .member-full-left::-webkit-scrollbar-thumb:hover,
  .member-full-right::-webkit-scrollbar-thumb:hover {
    background: var(--cyan-bright);
  }
  .member-full-name {
    font-family: var(--font-display);
    font-size: 1.3rem;
    color: var(--text-hi);
  }
  .member-full-role {
    color: var(--cyan-bright);
    font-size: 0.85rem;
    margin-top: 4px;
  }
  .member-full-channel {
    margin-top: 14px;
    display: inline-block;
    align-self: flex-start;
    color: var(--cyan-bright);
    font-size: 0.85rem;
    border-bottom: 1px solid var(--cyan-dim);
    padding-bottom: 2px;
  }
  .member-full-channel:hover { color: var(--text-hi); border-color: var(--cyan-bright); }
  .member-detail-list {
    margin-top: 18px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex-shrink: 0;
  }
  .member-detail-item {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    font-size: 0.85rem;
    color: var(--text-mid);
    border-bottom: 1px dashed var(--line);
    padding-bottom: 6px;
  }
  .member-detail-item .detail-label { color: var(--cyan-bright); flex-shrink: 0; }
  .member-turnaround-frame {
    position: relative;
    width: 100%;
    flex: none;
    aspect-ratio: 4 / 3;
    margin-top: auto;
    background: var(--bg-elevated-2);
    border: 1px solid var(--line);
    overflow: hidden;
  }
  .member-turnaround-frame img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .member-turnaround-placeholder {
    display: none;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    text-align: center;
    color: var(--text-mid);
    font-size: 0.78rem;
  }
  .member-full-story {
    color: var(--text-mid);
    font-size: 0.92rem;
    line-height: 1.8;
    white-space: pre-line;
  }
  @media (max-width: 780px) {
    .member-full-card {
      aspect-ratio: auto;
      flex-direction: column;
    }
    .member-full-left {
      flex: none;
      max-width: none;
      border-right: none;
      border-bottom: 1px solid var(--line);
    }
    .member-turnaround-frame {
      aspect-ratio: 4 / 3;
    }
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="container nav">
    <a href="index.html" class="nav-logo">
      <img src="logo.png" alt="團隊 Logo">
      <span class="nav-logo-text">妖契者</span>
    </a>
    <button class="nav-toggle" aria-label="開啟選單" aria-expanded="false" id="navToggle">☰</button>
    <nav class="nav-links" id="navLinks">
      <a href="index.html">首頁</a>
      <a href="members.html" class="active">成員介紹</a>
      <a href="videos.html">影片精選</a>
      <a href="about.html">關於我們／聯絡我們</a>
    </nav>
  </div>
</header>

<div class="page-hero">
  <div class="container">
    <span class="section-num">MEMBERS</span>
    <h1>成員介紹</h1>
    <p id="c-membersIntro">六位成員、六種代表動物，點進頻道看看我們平常在玩什麼、唱什麼、聊什麼。</p>
  </div>
</div>

<section>
  <div class="container">
    <div class="members-full-grid" id="c-members-grid"></div>
    <div class="placeholder-block" id="membersEmpty" style="display:none; margin-top:28px;">
      <strong>成員名單準備中</strong>
      <span>成員資料尚未設定，請透過後台編輯新增成員。</span>
    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="container">
    <div class="footer-top">
      <div class="footer-brand">
        <img src="logo.png" alt="團隊 Logo">
        妖契者
      </div>
      <div class="footer-social">
        <a href="#" aria-label="YouTube" id="c-social-youtube">YT</a>
        <a href="#" aria-label="X / Twitter" id="c-social-twitter">X</a>
        <a href="#" aria-label="Discord" id="c-social-discord">DC</a>
      </div>
    </div>
    <div class="footer-bottom">
      <span id="c-footerCopyright">© 2026 妖契者 VTuber Team. All rights reserved.</span>
      <a href="about.html">合作洽詢</a>
    </div>
  </div>
</footer>

<script>
  const navToggle = document.getElementById('navToggle');
  const navLinks = document.getElementById('navLinks');
  navToggle.addEventListener('click', () => {
    const open = navLinks.classList.toggle('open');
    navToggle.setAttribute('aria-expanded', open);
  });

  function escapeHtml(str) {
    return String(str ?? '').replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }
  function safeUrl(url) {
    if (!url) return '#';
    try {
      const u = new URL(url, window.location.href);
      return (u.protocol === 'http:' || u.protocol === 'https:') ? u.href : '#';
    } catch {
      return '#';
    }
  }

  fetch('content.json')
    .then(res => res.json())
    .then(data => {
      const page = data.membersPage || {};
      const site = data.site || {};
      const members = Array.isArray(data.members) ? data.members : [];

      if (page.intro) document.getElementById('c-membersIntro').textContent = page.intro;

      const grid = document.getElementById('c-members-grid');
      if (members.length === 0) {
        document.getElementById('membersEmpty').style.display = 'block';
      } else {
        grid.innerHTML = members.map((m, i) => {
          const idx = String(i + 1).padStart(2, '0');
          const turnaround = m.photoTurnaround || `member-${idx}-full.jpg`;
          const story = (m.story && m.story.trim()) ? m.story : '角色故事準備中，敬請期待。';
          const details = Array.isArray(m.details) ? m.details.filter(d => d && d.label && d.label.trim()) : [];
          const detailsHtml = details.map(d => `
            <div class="member-detail-item">
              <span class="detail-label">${escapeHtml(d.label)}</span>
              <span>${escapeHtml((d.value && d.value.trim()) ? d.value : '未填寫')}</span>
            </div>
          `).join('');
          return `
            <div class="member-full-card">
              <div class="member-full-left">
                <div class="member-full-name">${escapeHtml(m.name)}</div>
                <div class="member-full-role">${escapeHtml(m.role)}</div>
                <a href="${safeUrl(m.channelUrl)}" class="member-full-channel" target="_blank" rel="noopener">前往頻道 →</a>
                ${detailsHtml ? `<div class="member-detail-list">${detailsHtml}</div>` : ''}
                <div class="member-turnaround-frame">
                  <img src="${escapeHtml(turnaround)}" alt="${escapeHtml(m.name || '成員')}三視圖立繪" loading="lazy" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                  <span class="member-turnaround-placeholder">三視圖立繪待上傳</span>
                </div>
              </div>
              <div class="member-full-right">
                <p class="member-full-story">${escapeHtml(story)}</p>
              </div>
            </div>
          `;
        }).join('');
      }

      if (site.social) {
        if (site.social.youtube) document.getElementById('c-social-youtube').href = safeUrl(site.social.youtube);
        if (site.social.twitter) document.getElementById('c-social-twitter').href = safeUrl(site.social.twitter);
        if (site.social.discord) document.getElementById('c-social-discord').href = safeUrl(site.social.discord);
      }
      if (site.footerCopyright) document.getElementById('c-footerCopyright').textContent = site.footerCopyright;
    })
    .catch(() => {});
</script>
</body>
</html>
