<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>影片精選 | 妖契者</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="container nav">
    <a href="index.html" class="nav-logo">
      <img src="logo.png" alt="團隊 Logo">
      <span class="nav-logo-text">妖契者</span>
    </a>
    <button class="nav-toggle" aria-label="開啟選單" aria-expanded="false" id="navToggle">☰</button>
    <nav class="nav-links" id="navLinks">
      <a href="index.html">首頁</a>
      <a href="members.html">成員介紹</a>
      <a href="videos.html" class="active">影片精選</a>
      <a href="about.html">關於我們／聯絡我們</a>
    </nav>
  </div>
</header>

<div class="page-hero">
  <div class="container">
    <span class="section-num">VIDEOS</span>
    <h1>影片精選</h1>
    <p id="c-videosIntro">這裡將放上完整的影片與直播回顧列表，可依歌回、雜談、遊戲實況分類瀏覽。</p>
  </div>
</div>

<section>
  <div class="container">
    <div class="tab-switch" role="tablist">
      <button class="tab-btn active" role="tab" aria-selected="true" data-tab="clips">影片</button>
      <button class="tab-btn" role="tab" aria-selected="false" data-tab="streams">直播</button>
    </div>

    <div class="tab-panel active" id="tab-clips">
      <div class="video-row" id="clips-grid" style="display:none;"></div>
      <div class="placeholder-block" id="clips-empty">
        <strong>還沒有抓到影片資料</strong>
        請確認 <code>channels.json</code> 已填入正確頻道 ID，並確認 GitHub Actions 已成功執行過一次。
      </div>
    </div>

    <div class="tab-panel" id="tab-streams">
      <div class="video-row" id="streams-grid" style="display:none;"></div>
      <div class="placeholder-block" id="streams-empty">
        <strong>還沒有抓到直播回放資料</strong>
        請確認 <code>channels.json</code> 已填入正確頻道 ID，並確認 GitHub Actions 已成功執行過一次。
      </div>
    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="container">
    <div class="footer-top">
      <div class="footer-brand">
        <img src="logo.png" alt="團隊 Logo">
        妖契者
      </div>
      <div class="footer-social">
        <a href="#" aria-label="YouTube" id="c-social-youtube">YT</a>
        <a href="#" aria-label="X / Twitter" id="c-social-twitter">X</a>
        <a href="#" aria-label="Discord" id="c-social-discord">DC</a>
      </div>
    </div>
    <div class="footer-bottom">
      <span id="c-footerCopyright">© 2026 妖契者 VTuber Team. All rights reserved.</span>
      <a href="about.html">合作洽詢</a>
    </div>
  </div>
</footer>

<script>
  const navToggle = document.getElementById('navToggle');
  const navLinks = document.getElementById('navLinks');
  navToggle.addEventListener('click', () => {
    const open = navLinks.classList.toggle('open');
    navToggle.setAttribute('aria-expanded', open);
  });

  const tabButtons = document.querySelectorAll('.tab-btn');
  const tabPanels = {
    clips: document.getElementById('tab-clips'),
    streams: document.getElementById('tab-streams')
  };
  tabButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      tabButtons.forEach(b => { b.classList.remove('active'); b.setAttribute('aria-selected', 'false'); });
      Object.values(tabPanels).forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      btn.setAttribute('aria-selected', 'true');
      tabPanels[btn.dataset.tab].classList.add('active');
    });
  });

  function formatDate(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    return `${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')}`;
  }

  function renderList(list, gridEl, emptyEl) {
    if (!list || list.length === 0) {
      emptyEl.style.display = 'block';
      gridEl.style.display = 'none';
      return;
    }
    emptyEl.style.display = 'none';
    gridEl.style.display = 'grid';
    gridEl.innerHTML = list.map(v => `
      <a class="video-card" href="${v.url}" target="_blank" rel="noopener" style="display:block;">
        <div class="video-thumb">
          <img src="${v.thumbnail}" alt="${v.title}">
          <div class="video-thumb-play"><span>▶</span></div>
        </div>
        <div class="video-meta">
          <div class="video-title">${v.title}</div>
          <div class="video-sub">${v.channel} ・ ${formatDate(v.publishedAt)}</div>
        </div>
      </a>
    `).join('');
  }

  fetch('videos.json')
    .then(res => res.json())
    .then(data => {
      renderList(data.videos, document.getElementById('clips-grid'), document.getElementById('clips-empty'));
      renderList(data.streams, document.getElementById('streams-grid'), document.getElementById('streams-empty'));
    })
    .catch(() => {
      // videos.json 讀取失敗時，維持原本的提示文字
    });

  fetch('content.json')
    .then(res => res.json())
    .then(data => {
      const page = data.videosPage || {};
      const site = data.site || {};
      if (page.intro) document.getElementById('c-videosIntro').textContent = page.intro;
      if (site.social) {
        if (site.social.youtube) document.getElementById('c-social-youtube').href = site.social.youtube;
        if (site.social.twitter) document.getElementById('c-social-twitter').href = site.social.twitter;
        if (site.social.discord) document.getElementById('c-social-discord').href = site.social.discord;
      }
      if (site.footerCopyright) document.getElementById('c-footerCopyright').textContent = site.footerCopyright;
    })
    .catch(() => {});
</script>
</body>
</html>
