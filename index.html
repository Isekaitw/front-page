<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>妖契者 | VTuber 團隊</title>
<link rel="stylesheet" href="style.css">
<style>
  /* 1. 認識成員按鈕：邊框明顯且懸停/點擊時絕對不變藍色 */
  .btn-outline {
    border: 2px solid rgba(255, 255, 255, 0.8) !important;
    color: #ffffff !important;
    font-weight: 600;
    text-decoration: none;
  }
  .btn-outline:hover,
  .btn-outline:focus,
  .btn-outline:active {
    border-color: #ffffff !important;
    background-color: rgba(255, 255, 255, 0.15);
    color: #ffffff !important;
    outline: none;
  }

  /* 2. 隱藏後台入口（頁尾 Logo）：保持一般滑鼠指標，不顯示手掌 */
  #footerLogo {
    cursor: default !important;
  }

  /* 3. 團隊合照專屬樣式：矩形大圖，不使用圓形頭像框 */
  .about-photo {
    width: 100%;
    aspect-ratio: 16 / 9;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--line, rgba(255, 255, 255, 0.1));
  }
  .about-photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* 4. 防止動態文字閃爍專用：資料載入完成前維持平滑渲染 */
  .dyn-text {
    min-height: 1em;
    display: inline-block;
  }

  /* 5. 保留「我們是誰」後台輸入的換行符號 */
  #c-aboutText {
    white-space: pre-line;
  }

  /* 6. 維持大方塊直立佈局，僅優化文字與底邊齊平邏輯 */
  .member-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 24px 16px;
  }

  .member-card {
    background: rgba(255, 255, 255, 0.02);
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 12px;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    align-items: center; /* 保持頭像與名字水平居中 */
    text-align: center;
    height: 100%; /* 強制同列卡片等高 */
    box-sizing: border-box;
  }

  .member-photo {
    width: 90px;
    height: 90px;
    flex-shrink: 0;
    border-radius: 50%;
    overflow: hidden;
    margin-bottom: 12px;
    border: 1px solid rgba(255, 255, 255, 0.15);
  }

  .member-photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .member-info {
    display: flex;
    flex-direction: column;
    flex: 1;
    width: 100%;
    align-items: stretch;
  }

  .member-name {
    font-size: 1.1rem;
    font-weight: 700;
    color: #ffffff;
    margin-bottom: 4px;
    text-align: center;
  }

  .member-role {
    font-size: 0.85rem;
    color: rgba(255, 255, 255, 0.6);
    margin-bottom: 12px;
    text-align: center;
  }

  /* 簡介改為靠左對齊，固定區域高度確保文字長度不一也不會破壞版面 */
  .member-desc {
    font-size: 0.88rem;
    line-height: 1.5;
    color: rgba(255, 255, 255, 0.8);
    text-align: left;
    white-space: pre-line;
    margin-bottom: 16px;
    max-height: 4.5em; /* 約 3 行文字高度 */
    overflow-y: auto;  /* 過長時內部滾動，維持整體卡片高度一致 */
    padding-right: 4px;
  }

  /* 隱藏微型滾動條但保留功能，維持畫面美觀 */
  .member-desc::-webkit-scrollbar {
    width: 3px;
  }
  .member-desc::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.2);
    border-radius: 3px;
  }

  /* 強制將「前往頻道 →」對齊於卡片底部 */
  .member-channel {
    margin-top: auto;
    font-size: 0.88rem;
    color: #7cefff;
    text-decoration: none;
    font-weight: 600;
    text-align: center;
    padding-top: 8px;
  }

  .member-channel:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>

<!-- ===================== 導覽列 ===================== -->
<header class="site-header">
  <div class="container nav">
    <a href="index.html" class="nav-logo">
      <img src="logo.png" alt="團隊 Logo">
      <span class="nav-logo-text">妖契者</span>
    </a>
    <button class="nav-toggle" aria-label="開啟選單" aria-expanded="false" id="navToggle">☰</button>
    <nav class="nav-links" id="navLinks">
      <a href="index.html" class="active">首頁</a>
      <a href="members.html">成員介紹</a>
      <a href="videos.html">影片精選</a>
      <a href="about.html">關於我們／聯絡我們</a>
    </nav>
  </div>
</header>

<!-- ===================== Hero 橫幅 ===================== -->
<div class="hero-banner">
  <img src="banner.jpg" alt="團隊橫幅">
  <div class="hero-overlay">
    <div class="hero-overlay-inner">
      <h1 class="hero-title dyn-text" id="c-heroTitle"></h1>
      <div class="hero-actions">
        <a href="videos.html" class="btn btn-primary">查看最新影片</a>
        <a href="members.html" class="btn btn-outline">認識成員</a>
      </div>
    </div>
  </div>
</div>

<!-- ===================== 成員預覽 ===================== -->
<section>
  <div class="container">
    <div class="section-head">
      <div>
        <span class="section-num">MEMBERS</span>
        <h2>認識我們的成員</h2>
      </div>
      <a href="members.html" class="section-link">查看完整成員介紹</a>
    </div>
    <!-- 完全由 JS 動態渲染，無寫死舊卡片 -->
    <div class="member-grid" id="c-member-grid"></div>
  </div>
</section>

<!-- ===================== 影片精選 ===================== -->
<section>
  <div class="container">
    <div class="section-head">
      <div>
        <span class="section-num">FEATURED</span>
        <h2>精選影片與直播回顧</h2>
        <p class="section-desc">錯過直播也沒關係，這裡整理了近期最值得回看的片段。</p>
      </div>
      <a href="videos.html" class="section-link">查看所有影片</a>
    </div>
    <!-- 預設隱藏，待 JSON 讀取後一次性顯示最新精選影片 -->
    <div class="video-row" id="home-video-grid" style="display:none;"></div>
  </div>
</section>

<!-- ===================== 團隊介紹 ===================== -->
<section>
  <div class="container about-strip">
    <div>
      <span class="section-num">ABOUT</span>
      <h2>我們是誰</h2>
      <p id="c-aboutText" class="dyn-text"></p>
      <div class="stat-line">
        <div class="stat-item"><span>成立年分</span><strong id="c-foundedYear" class="dyn-text"></strong></div>
        <div class="stat-item"><span>成員數量</span><strong id="c-memberCount" class="dyn-text"></strong></div>
      </div>
    </div>
    <div class="about-photo">
      <img src="team-photo.jpg" alt="團隊合照">
    </div>
  </div>
</section>

<!-- ===================== 頁尾 ===================== -->
<footer class="site-footer">
  <div class="container">
    <div class="footer-top">
      <div class="footer-brand">
        <img src="logo.png" alt="團隊 Logo" id="footerLogo">
        妖契者
      </div>
      <div class="footer-social">
        <a href="#" aria-label="YouTube" id="c-social-youtube">YT</a>
        <a href="#" aria-label="X / Twitter" id="c-social-twitter">X</a>
        <a href="#" aria-label="Discord" id="c-social-discord">DC</a>
      </div>
    </div>
    <div class="footer-bottom">
      <span id="c-footerCopyright" class="dyn-text"></span>
      <a href="about.html">合作洽詢</a>
    </div>
  </div>
</footer>

<script>
  const navToggle = document.getElementById('navToggle');
  const navLinks = document.getElementById('navLinks');
  navToggle.addEventListener('click', () => {
    const open = navLinks.classList.toggle('open');
    navToggle.setAttribute('aria-expanded', open);
  });

  // ---------- 隱藏後台入口：頁尾 Logo 連點 5 下（3 秒內）進入 admin.html ----------
  (function () {
    const footerLogo = document.getElementById('footerLogo');
    let clickCount = 0;
    let resetTimer = null;
    footerLogo.addEventListener('click', () => {
      clickCount += 1;
      clearTimeout(resetTimer);
      resetTimer = setTimeout(() => { clickCount = 0; }, 3000);
      if (clickCount >= 5) {
        clickCount = 0;
        window.location.href = 'admin.html';
      }
    });
  })();

  function formatDate(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    return `${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')}`;
  }

  // 1. 讀取精選影片資料（無舊畫面佔位，直接一次繪製）
  fetch('videos.json')
    .then(res => res.json())
    .then(data => {
      const combined = [...(data.videos || []), ...(data.streams || [])]
        .sort((a, b) => (b.publishedAt || '').localeCompare(a.publishedAt || ''))
        .slice(0, 3);
      if (combined.length === 0) return;
      const grid = document.getElementById('home-video-grid');
      grid.innerHTML = combined.map(v => `
        <a class="video-card" href="${v.url}" target="_blank" rel="noopener" style="display:block;">
          <div class="video-thumb">
            <img src="${v.thumbnail}" alt="${v.title}">
            <div class="video-thumb-play"><span>▶</span></div>
          </div>
          <div class="video-meta">
            <div class="video-title">${v.title}</div>
            <div class="video-sub">${v.channel} ・ ${formatDate(v.publishedAt)}</div>
          </div>
        </a>
      `).join('');
      grid.style.display = 'grid';
    })
    .catch(() => {});

  // 2. 讀取頁面文字與成員資料（直接寫入空白容器，絕不閃爍）
  fetch('content.json')
    .then(res => res.json())
    .then(data => {
      const home = data.home || {};
      const site = data.site || {};

      if (home.heroTitle) document.getElementById('c-heroTitle').textContent = home.heroTitle;
      if (home.aboutText) document.getElementById('c-aboutText').textContent = home.aboutText;
      if (home.stats) {
        if (home.stats.foundedYear) document.getElementById('c-foundedYear').textContent = home.stats.foundedYear;
        if (home.stats.memberCount) document.getElementById('c-memberCount').textContent = home.stats.memberCount;
      }
      
      // 動態繪製成員卡片
      if (Array.isArray(home.members) && home.members.length > 0) {
        const memberGrid = document.getElementById('c-member-grid');
        memberGrid.innerHTML = home.members.map((m, i) => {
          const photoImg = m.photo || `member-${String(i + 1).padStart(2, '0')}.jpg`;
          return `
            <div class="member-card">
              <div class="member-photo">
                <img src="${photoImg}" alt="${m.name || '成員照片'}">
              </div>
              <div class="member-info">
                <div class="member-name">${m.name || ''}</div>
                <div class="member-role">${m.role || ''}</div>
                <p class="member-desc">${m.desc || ''}</p>
                <a href="${m.channelUrl || '#'}" class="member-channel" target="_blank" rel="noopener">前往頻道 →</a>
              </div>
            </div>
          `;
        }).join('');
      }

      // 社群連結與頁尾版權
      if (site.social) {
        if (site.social.youtube) document.getElementById('c-social-youtube').href = site.social.youtube;
        if (site.social.twitter) document.getElementById('c-social-twitter').href = site.social.twitter;
        if (site.social.discord) document.getElementById('c-social-discord').href = site.social.discord;
      }
      if (site.footerCopyright) document.getElementById('c-footerCopyright').textContent = site.footerCopyright;
    })
    .catch(() => {});
</script>
</body>
</html>
